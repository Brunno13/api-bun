when:
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-trivy

# =========================================================
# O Gitleaks precisa do histórico + objetos completos.
# O clone parcial padrão do Woodpecker não serve para isso.
# =========================================================

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

steps:
  # =========================================================
  # VALIDAR HISTÓRICO GIT COMPLETO
  # =========================================================

  - name: gitleaks-prepare-history
    image: alpine:3.23

    commands:
      - |
        set -eu

        apk add --no-cache git >/dev/null

        echo "===== GITLEAKS / HISTORICO GIT ====="

        git config remote.origin.fetch \
          "+refs/heads/*:refs/remotes/origin/*"

        git fetch \
          --all \
          --tags \
          --prune

        SHALLOW="$(
          git rev-parse --is-shallow-repository
        )"

        COMMITS_ALL="$(
          git rev-list --all --count
        )"

        TAGS="$(
          git tag | wc -l | tr -d ' '
        )"

        PROMISOR="$(
          git config --get remote.origin.promisor \
          || true
        )"

        PARTIAL_FILTER="$(
          git config --get remote.origin.partialclonefilter \
          || true
        )"

        echo "SHALLOW=$SHALLOW"
        echo "COMMITS_ALL=$COMMITS_ALL"
        echo "TAGS=$TAGS"
        echo "PROMISOR=${PROMISOR:-false}"
        echo "PARTIAL_FILTER=${PARTIAL_FILTER:-none}"

        if [ "$SHALLOW" != "false" ]; then
          echo "ERRO: o repositório ainda está shallow."
          exit 1
        fi

        if [ "$PROMISOR" = "true" ]; then
          echo "ERRO: o clone ainda está configurado como promisor/partial."
          exit 1
        fi

        if [ -n "$PARTIAL_FILTER" ]; then
          echo "ERRO: partialclonefilter ainda está configurado."
          exit 1
        fi

        echo
        echo "===== VERIFICANDO OBJETOS AUSENTES ====="

        MISSING_OBJECTS="$(
          git rev-list \
            --objects \
            --all \
            --missing=print \
          | grep '^?' \
          || true
        )"

        if [ -n "$MISSING_OBJECTS" ]; then
          echo "ERRO: existem objetos Git ausentes."
          printf '%s\n' "$MISSING_OBJECTS"
          exit 1
        fi

        echo "MISSING_OBJECTS=0"

        echo
        echo "===== GIT FSCK ====="

        git fsck \
          --full \
          --no-dangling

        echo
        echo "===== PREFLIGHT GIT LOG ====="

        # Executa exatamente a classe de operação que o Gitleaks
        # precisa realizar. Qualquer objeto histórico ausente deve
        # derrubar o workflow aqui, antes do scanner.
        git log \
          -p \
          -U0 \
          --full-history \
          --all \
          --diff-filter=tuxdb \
          >/dev/null

        echo "GIT_LOG_PREFLIGHT=PASS"

        echo
        echo "GITLEAKS_HISTORY_PREPARE=PASS"

  # =========================================================
  # SCAN COMPLETO DO HISTÓRICO
  # =========================================================

  - name: gitleaks-scan
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb

    commands:
      - |
        set -eu

        mkdir -p .security-results

        echo "===== GITLEAKS VERSION ====="
        gitleaks version

        echo
        echo "===== GITLEAKS GIT SCAN ====="

        # Exit 10 significa "findings encontrados".
        # Assim podemos aceitar findings nesta fase de baseline,
        # mas ainda distinguir erros reais do scanner.
        set +e

        gitleaks git \
          --platform=gitea \
          --redact=100 \
          --no-banner \
          --no-color \
          --report-format=json \
          --report-path=.security-results/gitleaks.json \
          --exit-code=10 \
          . \
          >.security-results/gitleaks.stdout.log \
          2>.security-results/gitleaks.stderr.log

        GITLEAKS_RC="$?"

        set -e

        cat .security-results/gitleaks.stdout.log

        if [ -s .security-results/gitleaks.stderr.log ]; then
          cat .security-results/gitleaks.stderr.log >&2
        fi

        echo
        echo "GITLEAKS_EXIT_CODE=$GITLEAKS_RC"

        # v8.30.x pode registrar erro do Git sem necessariamente
        # produzir um exit code útil para nossa baseline.
        if grep -q 'ERR \[git\]' \
          .security-results/gitleaks.stderr.log; then

          echo "ERRO: Gitleaks reportou falha ao processar o Git."
          exit 1
        fi

        case "$GITLEAKS_RC" in
          0)
            echo "Nenhum finding encontrado."
            ;;

          10)
            echo "Findings encontrados; permitido nesta fase de baseline."
            ;;

          *)
            echo "ERRO: Gitleaks terminou com código inesperado."
            exit "$GITLEAKS_RC"
            ;;
        esac

        test -s .security-results/gitleaks.json

        echo
        echo "GITLEAKS_SCAN=PASS"

  # =========================================================
  # SCAN DO ESTADO ATUAL
  # =========================================================

  - name: gitleaks-current
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb

    commands:
      - |
        set -eu

        mkdir -p .security-results

        echo "===== GITLEAKS CURRENT TREE ====="

        set +e

        gitleaks dir \
          --redact=100 \
          --no-banner \
          --no-color \
          --report-format=json \
          --report-path=.security-results/gitleaks-current.json \
          --exit-code=10 \
          .

        GITLEAKS_CURRENT_RC="$?"

        set -e

        echo "GITLEAKS_CURRENT_EXIT_CODE=$GITLEAKS_CURRENT_RC"

        case "$GITLEAKS_CURRENT_RC" in
          0)
            echo "Nenhum secret encontrado no estado atual."
            ;;

          10)
            echo "Findings encontrados no estado atual."
            ;;

          *)
            echo "ERRO: Gitleaks current scan terminou com código inesperado."
            exit "$GITLEAKS_CURRENT_RC"
            ;;
        esac

        # Gitleaks pode gerar [] quando não há findings.
        if [ ! -f .security-results/gitleaks-current.json ]; then
          printf '[]\n' > .security-results/gitleaks-current.json
        fi

        echo
        echo "GITLEAKS_CURRENT_SCAN=PASS"  

  # =========================================================
  # RESUMO SEGURO
  # Não imprime Secret nem Match.
  # =========================================================

  - name: gitleaks-summary
    image: alpine:3.23

    commands:
      - |
        set -eu

        apk add --no-cache jq >/dev/null

        REPORT=".security-results/gitleaks.json"

        test -s "$REPORT"

        echo "===== GITLEAKS RESUMO ====="

        FINDINGS="$(
          jq 'length' "$REPORT"
        )"

        FILES="$(
          jq \
            '[.[].File] | unique | length' \
            "$REPORT"
        )"

        COMMITS="$(
          jq \
            '[.[].Commit] | unique | length' \
            "$REPORT"
        )"

        echo "FINDINGS=$FINDINGS"
        echo "FILES_WITH_FINDINGS=$FILES"
        echo "COMMITS_WITH_FINDINGS=$COMMITS"

        echo
        echo "===== CONTAGEM POR REGRA ====="

        jq -r '
          sort_by(.RuleID)
          | group_by(.RuleID)
          | .[]
          | "\(.[0].RuleID)=\(length)"
        ' "$REPORT"

        echo
        echo "===== FINDINGS ====="

        jq -r '
          .[]
          | "GITLEAKS rule=\(.RuleID // "-") file=\(.File // "-") line=\(.StartLine // "-") commit=\(.Commit // "-")"
        ' "$REPORT"

        echo
        echo "===== CLASSIFICACAO ====="

        HISTORY_UNIQUE_SECRETS=$(
          jq \
            '[.[].Secret] | unique | length' \
            .security-results/gitleaks.json
        )

        CURRENT_FINDINGS=$(
          jq \
            'length' \
            .security-results/gitleaks-current.json
        )

        CURRENT_UNIQUE_SECRETS=$(
          jq \
            '[.[].Secret] | unique | length' \
            .security-results/gitleaks-current.json
        )

        echo "HISTORY_UNIQUE_SECRETS=$HISTORY_UNIQUE_SECRETS"
        echo "CURRENT_FINDINGS=$CURRENT_FINDINGS"
        echo "CURRENT_UNIQUE_SECRETS=$CURRENT_UNIQUE_SECRETS"

        echo
        echo "===== FINDINGS ATUAIS POR ARQUIVO ====="

        jq -r '
          sort_by(.File)
          | group_by(.File)
          | .[]
          | "\(.[0].File)=\(length)"
        ' .security-results/gitleaks-current.json

        echo
        echo "===== HISTORICO POR ARQUIVO ====="

        jq -r '
          sort_by(.File)
          | group_by(.File)
          | .[]
          | "\(.[0].File): findings=\(length) unique_secrets=\([.[].Secret] | unique | length) commits=\([.[].Commit] | unique | length)"
        ' .security-results/gitleaks.json

        echo
        echo "GITLEAKS_SUMMARY=PASS"