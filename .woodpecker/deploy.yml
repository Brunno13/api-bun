when:
  - event: push
    branch: main

  - event: tag

labels:
  platform: linux/arm64

clone:
  git:
    image: woodpeckerci/plugin-git

steps:
  # =========================================================
  # NOTIFICAÇÕES DE INÍCIO
  # =========================================================

  - name: notify-start-staging
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Staging pipeline started · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: push
        branch: main

  - name: notify-start-production
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Production pipeline started · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: tag

  # =========================================================
  # FASE 1: TEST AND BUILD
  # =========================================================

  - name: testar-codigo
    image: oven/bun:alpine
    commands:
      - echo "Instalando dependências para os testes..."
      - bun install

      - echo "Executando a suíte de testes..."
      - bun test

  - name: build-executaveis
    image: oven/bun:alpine
    commands:
      - echo "Criando diretório para os binários..."
      - mkdir -p ./bin

      - echo "Compilando executáveis standalone para Linux, Windows e macOS..."

      - bun build ./src/index.ts
        --compile
        --target=bun-linux-x64
        --outfile=./bin/api-bun-linux

      - bun build ./src/index.ts
        --compile
        --target=bun-windows-x64
        --outfile=./bin/api-bun-windows.exe

      - bun build ./src/index.ts
        --compile
        --target=bun-darwin-x64
        --outfile=./bin/api-bun-macos

    when:
      - event: tag

  - name: build-imagem-docker
    image: docker:cli

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    commands:
      - echo "Atualizando a imagem Docker api-bun:latest..."
      - docker build -t api-bun:latest .

  # =========================================================
  # FASE 2: STAGING
  # =========================================================

  - name: deploy-staging
    image: docker:cli

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      CONTAINER_NAME: api-bun-staging

      APP_PORT:
        from_secret: staging_app_port

      HOST_DATA_PATH:
        from_secret: staging_host_data_path

      BETTER_AUTH_URL:
        from_secret: staging_better_auth_url

      BETTER_AUTH_SECRET:
        from_secret: staging_better_auth_secret

      OTEL_EXPORTER_URL:
        from_secret: staging_otel_exporter_url

      GARAGE_S3_ENDPOINT:
        from_secret: staging_garage_s3_endpoint

      GARAGE_S3_ACCESS_KEY_ID:
        from_secret: staging_garage_s3_access_key_id

      GARAGE_S3_SECRET_ACCESS_KEY:
        from_secret: staging_garage_s3_secret_access_key

      GARAGE_S3_BUCKET_NAME:
        from_secret: staging_garage_s3_bucket_name

      GARAGE_S3_PUBLIC_URL:
        from_secret: staging_garage_s3_public_url

    commands:
      - |
        set -eu

        echo "Preparando permissões do diretório persistente de Homologação..."

        test -n "$HOST_DATA_PATH"

        docker run --rm \
          -v "$HOST_DATA_PATH:/data" \
          alpine:3.23 \
          chown -R 1000:1000 /data

        echo "Subindo o ambiente de Homologação via Docker Compose..."

        docker compose -p api-bun-staging up -d

    when:
      - event: push
        branch: main

  # =========================================================
  # FASE 3: PRODUCTION
  # =========================================================

  - name: gerar-release-notes
    image: alpine

    environment:
      GITEA_TOKEN:
        from_secret: gitea_token

    commands:
      - apk add --no-cache curl git jq

      - |
        set -eu

        # ---------------------------------------------------------
        # CONFIGURAÇÃO
        # ---------------------------------------------------------

        API_BASE="https://gitea.brunnoserver.duckdns.org/api/v1"
        REPO_API="$API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}"
        RELEASES_URL="$REPO_API/releases"

        TAG="${CI_COMMIT_TAG}"
        RELEASE_NAME="Versão $TAG"

        # Encode seguro para uso da tag em URL.
        TAG_ENCODED=$(
          printf '%s' "$TAG" \
          | jq -sRr @uri
        )

        echo "=========================================="
        echo " RELEASE GITEA"
        echo "=========================================="
        echo "Repositório: ${CI_REPO_OWNER}/${CI_REPO_NAME}"
        echo "Tag atual:   $TAG"

        # ---------------------------------------------------------
        # GARANTIR HISTÓRICO COMPLETO + TAGS
        # ---------------------------------------------------------

        git config remote.origin.fetch \
          "+refs/heads/*:refs/remotes/origin/*"

        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "Repository shallow detectado. Expandindo histórico..."
          git fetch --unshallow --tags
        else
          echo "Repository já possui histórico completo."
          git fetch --tags
        fi

        git fetch --all --prune

        # ---------------------------------------------------------
        # DESCOBRIR TAG ANTERIOR
        #
        # HEAD é o commit da tag atual.
        # HEAD^ impede que a própria tag atual seja retornada.
        # ---------------------------------------------------------

        PREV_TAG=$(
          git describe \
            --tags \
            --abbrev=0 \
            HEAD^ \
            2>/dev/null \
          || true
        )

        if [ -n "$PREV_TAG" ]; then
          echo "Tag anterior: $PREV_TAG"

          CHANGELOG=$(
            git log \
              --pretty=format:"- %h %s" \
              "$PREV_TAG..HEAD"
          )
        else
          echo "Tag anterior: nenhuma"

          CHANGELOG=$(
            git log \
              --pretty=format:"- %h %s"
          )
        fi

        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- Nenhum commit novo encontrado para esta versão."
        fi

        echo
        echo "=== COMMITS DA RELEASE ==="
        printf '%s\n' "$CHANGELOG"

        # ---------------------------------------------------------
        # RELEASE NOTES
        # ---------------------------------------------------------

        RELEASE_BODY=$(
          printf \
            '🚀 Deploy automático realizado com sucesso pelo Woodpecker CI.\n\n---\n\n%s' \
            "$CHANGELOG"
        )

        printf '%s\n' \
          "$RELEASE_BODY" \
          > .release_body.txt

        # Payload usado para criação.
        CREATE_PAYLOAD=$(
          jq \
            -n \
            --arg tag "$TAG" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false
            }'
        )

        # Payload usado caso a release já exista.
        UPDATE_PAYLOAD=$(
          jq \
            -n \
            --arg tag "$TAG" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              draft: false,
              prerelease: false
            }'
        )

        # ---------------------------------------------------------
        # RELEASE IDEMPOTENTE
        #
        # 200 -> release já existe -> atualizar
        # 404 -> release não existe -> criar
        # outros -> falhar
        # ---------------------------------------------------------

        echo
        echo "=== VERIFICANDO RELEASE EXISTENTE ==="

        RELEASE_LOOKUP_FILE=$(
          mktemp
        )

        HTTP_CODE=$(
          curl \
            -sS \
            -o "$RELEASE_LOOKUP_FILE" \
            -w '%{http_code}' \
            "$REPO_API/releases/tags/$TAG_ENCODED" \
            -H "Accept: application/json" \
            -H "Authorization: token $GITEA_TOKEN"
        )

        case "$HTTP_CODE" in

          200)
            echo "Release $TAG já existe. Atualizando..."

            RELEASE_ID=$(
              jq -r \
                '.id // empty' \
                "$RELEASE_LOOKUP_FILE"
            )

            if [ -z "$RELEASE_ID" ]; then
              echo "❌ ERRO: Release encontrada, mas sem ID válido."
              rm -f "$RELEASE_LOOKUP_FILE"
              exit 1
            fi

            RESPONSE=$(
              curl \
                -fsS \
                -X PATCH \
                "$RELEASES_URL/$RELEASE_ID" \
                -H "Accept: application/json" \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$UPDATE_PAYLOAD"
            )

            echo "Release existente atualizada."
            ;;

          404)
            echo "Release $TAG ainda não existe. Criando..."

            RESPONSE=$(
              curl \
                -fsS \
                -X POST \
                "$RELEASES_URL" \
                -H "Accept: application/json" \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$CREATE_PAYLOAD"
            )

            RELEASE_ID=$(
              printf '%s' "$RESPONSE" \
              | jq -r '.id // empty'
            )

            echo "Nova release criada."
            ;;

          *)
            echo "❌ ERRO ao consultar release $TAG."
            echo "HTTP_CODE=$HTTP_CODE"

            echo "Resposta do Gitea:"
            cat "$RELEASE_LOOKUP_FILE"

            rm -f "$RELEASE_LOOKUP_FILE"
            exit 1
            ;;
        esac

        rm -f "$RELEASE_LOOKUP_FILE"

        # ---------------------------------------------------------
        # VALIDAR RESPOSTA FINAL
        # ---------------------------------------------------------

        RELEASE_ID=$(
          printf '%s' "$RESPONSE" \
          | jq -r '.id // empty'
        )

        if [ -z "$RELEASE_ID" ]; then
          echo "❌ ERRO: O Gitea não retornou RELEASE_ID válido."
          exit 1
        fi

        UPLOAD_URL=$(
          printf '%s' "$RESPONSE" \
          | jq -r '.upload_url // empty'
        )

        # Fallback para versões do Gitea que eventualmente não
        # retornem upload_url na resposta.
        if [ -z "$UPLOAD_URL" ]; then
          UPLOAD_URL="$RELEASES_URL/$RELEASE_ID/assets"
        fi

        echo
        echo "=== RELEASE PRONTA ==="
        echo "TAG=$TAG"
        echo "RELEASE_ID=$RELEASE_ID"

        # ---------------------------------------------------------
        # VALIDAR BINÁRIOS ANTES DE MODIFICAR ATTACHMENTS
        # ---------------------------------------------------------

        echo
        echo "=== VERIFICANDO PASTA DE BINÁRIOS ==="

        ls -lah ./bin/

        for FILE in \
          ./bin/api-bun-linux \
          ./bin/api-bun-windows.exe \
          ./bin/api-bun-macos
        do
          if [ ! -s "$FILE" ]; then
            echo "❌ ERRO: arquivo ausente ou vazio: $FILE"
            exit 1
          fi
        done

        # ---------------------------------------------------------
        # CARREGAR ATTACHMENTS EXISTENTES
        # ---------------------------------------------------------

        echo
        echo "=== CONSULTANDO ANEXOS EXISTENTES ==="

        ASSETS=$(
          curl \
            -fsS \
            "$RELEASES_URL/$RELEASE_ID/assets" \
            -H "Accept: application/json" \
            -H "Authorization: token $GITEA_TOKEN"
        )

        # ---------------------------------------------------------
        # FUNÇÃO DE UPLOAD IDEMPOTENTE
        #
        # Caso já exista attachment com o mesmo nome:
        #   1. remove o attachment antigo
        #   2. envia o binário atual
        #
        # Um retry converge para o mesmo estado final.
        # ---------------------------------------------------------

        upload_asset()
        {
          FILE_PATH="$1"
          ASSET_NAME="$2"

          echo
          echo "=== ASSET: $ASSET_NAME ==="

          EXISTING_IDS=$(
            printf '%s' "$ASSETS" \
            | jq \
                -r \
                --arg name "$ASSET_NAME" \
                '.[] | select(.name == $name) | .id'
          )

          if [ -n "$EXISTING_IDS" ]; then
            echo "Anexo existente encontrado. Removendo antes do reupload..."

            for ASSET_ID in $EXISTING_IDS
            do
              echo "Removendo attachment ID=$ASSET_ID"

              curl \
                -fsS \
                -X DELETE \
                "$RELEASES_URL/$RELEASE_ID/assets/$ASSET_ID" \
                -H "Authorization: token $GITEA_TOKEN"
            done
          else
            echo "Nenhum anexo anterior com esse nome."
          fi

          ASSET_NAME_ENCODED=$(
            printf '%s' "$ASSET_NAME" \
            | jq -sRr @uri
          )

          echo "Enviando $ASSET_NAME..."

          UPLOAD_RESPONSE=$(
            curl \
              -fsS \
              -X POST \
              "$UPLOAD_URL?name=$ASSET_NAME_ENCODED" \
              -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@$FILE_PATH"
          )

          UPLOADED_NAME=$(
            printf '%s' "$UPLOAD_RESPONSE" \
            | jq -r '.name // empty'
          )

          UPLOADED_ID=$(
            printf '%s' "$UPLOAD_RESPONSE" \
            | jq -r '.id // empty'
          )

          if [ "$UPLOADED_NAME" != "$ASSET_NAME" ] \
            || [ -z "$UPLOADED_ID" ]; then

            echo "❌ ERRO: Gitea não confirmou o upload de $ASSET_NAME."
            exit 1
          fi

          echo "✅ $ASSET_NAME enviado com sucesso. ID=$UPLOADED_ID"
        }

        # ---------------------------------------------------------
        # UPLOAD DOS TRÊS BINÁRIOS
        # ---------------------------------------------------------

        echo
        echo "=== INICIANDO UPLOAD DOS ANEXOS ==="

        upload_asset \
          "./bin/api-bun-linux" \
          "api-bun-linux"

        upload_asset \
          "./bin/api-bun-windows.exe" \
          "api-bun-windows.exe"

        upload_asset \
          "./bin/api-bun-macos" \
          "api-bun-macos"

        echo
        echo "=========================================="
        echo "✅ RELEASE FINALIZADA COM SUCESSO NO GITEA"
        echo "=========================================="

    when:
      - event: tag

  - name: espelhar-github
    image: alpine/git

    environment:
      GITHUB_USER: Brunno13

      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - echo "=== SINCRONIZANDO COM O GITHUB ==="

      - git config
        --global
        --add
        safe.directory
        "*"

      - git remote add
        github
        "https://$GITHUB_USER:$GITHUB_TOKEN@github.com/$GITHUB_USER/api-bun.git"

      - git push github main --force

      - git push
        github
        "${CI_COMMIT_TAG}"
        --force

    when:
      - event: tag

  - name: criar-release-github
    image: alpine

    environment:
      GITHUB_USER: Brunno13

      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - apk add --no-cache curl jq

      - |
        set -e

        echo "=== CRIANDO RELEASE NO GITHUB ==="

        GITHUB_API_URL="https://api.github.com/repos/$GITHUB_USER/api-bun/releases"

        if [ -f .release_body.txt ]; then
          RELEASE_BODY=$(
            cat .release_body.txt
          )
        else
          RELEASE_BODY="🚀 Lançamento automatizado sincronizado a partir do servidor Gitea interno."
        fi

        JSON_PAYLOAD=$(
          jq \
            -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "Versão ${CI_COMMIT_TAG}" \
            --arg body "$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }'
        )

        RESPONSE=$(
          curl \
            -s \
            -X POST \
            "$GITHUB_API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
        )

        RELEASE_ID=$(
          echo "$RESPONSE" \
          | jq -r '.id'
        )

        if [ "$RELEASE_ID" = "null" ] \
          || [ -z "$RELEASE_ID" ]; then

          echo \
            "❌ ERRO: O GitHub não retornou um ID válido."

          echo \
            "Resposta recebida: $RESPONSE"

          exit 1
        fi

        echo \
          "=== INICIANDO UPLOAD DOS ANEXOS NO GITHUB ==="

        GH_UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_USER/api-bun/releases/$RELEASE_ID/assets"

        curl \
          -fsS \
          -X POST \
          "$GH_UPLOAD_URL?name=api-bun-linux" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary \
          "@./bin/api-bun-linux"

        curl \
          -fsS \
          -X POST \
          "$GH_UPLOAD_URL?name=api-bun-windows.exe" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary \
          "@./bin/api-bun-windows.exe"

        curl \
          -fsS \
          -X POST \
          "$GH_UPLOAD_URL?name=api-bun-macos" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary \
          "@./bin/api-bun-macos"

        echo \
          "✅ RELEASE NO GITHUB CRIADA COM SUCESSO!"

    when:
      - event: tag

  - name: deploy-producao
    image: docker:cli

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      CONTAINER_NAME: api-bun-prod

      APP_PORT:
        from_secret: prod_app_port

      HOST_DATA_PATH:
        from_secret: prod_host_data_path

      BETTER_AUTH_URL:
        from_secret: prod_better_auth_url

      BETTER_AUTH_SECRET:
        from_secret: prod_better_auth_secret

      OTEL_EXPORTER_URL:
        from_secret: prod_otel_exporter_url

      GARAGE_S3_ENDPOINT:
        from_secret: prod_garage_s3_endpoint

      GARAGE_S3_ACCESS_KEY_ID:
        from_secret: prod_garage_s3_access_key_id

      GARAGE_S3_SECRET_ACCESS_KEY:
        from_secret: prod_garage_s3_secret_access_key

      GARAGE_S3_BUCKET_NAME:
        from_secret: prod_garage_s3_bucket_name

      GARAGE_S3_PUBLIC_URL:
        from_secret: prod_garage_s3_public_url

    commands:
      - |
        set -eu

        echo "Preparando permissões do diretório persistente de Produção..."

        test -n "$HOST_DATA_PATH"

        docker run --rm \
          -v "$HOST_DATA_PATH:/data" \
          alpine:3.23 \
          chown -R 1000:1000 /data

        echo "Subindo o ambiente de Produção Oficial via Docker Compose..."

        docker compose \
          -p api-bun-producao \
          up \
          -d

    when:
      - event: tag

  # =========================================================
  # NOTIFICAÇÕES DE SUCESSO E ERRO
  # =========================================================

  - name: notify-success-staging
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Staging pipeline finished successfully · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: push
        branch: main
        status: [success]

  - name: notify-error-staging
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Staging pipeline failed · $${TIMESTAMP}" \
          -F "priority=8" \
          || true

    when:
      - event: push
        branch: main
        status: [failure]

  - name: notify-success-production
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Production pipeline finished successfully · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: tag
        status: [success]

  - name: notify-error-production
    image: curlimages/curl

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        TIMESTAMP="$(TZ=UTC3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · Api-bun · Production pipeline failed · $${TIMESTAMP}" \
          -F "priority=8" \
          || true

    when:
      - event: tag
        status: [failure]