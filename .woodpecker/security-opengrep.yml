when:
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  - name: opengrep-sast
    image: debian:12-slim

    commands:
      - |
        set -eu

        export DEBIAN_FRONTEND=noninteractive

        echo "===== OPENGREP SAST POC ====="

        echo
        echo "===== ARQUITETURA ====="

        uname -a
        uname -m

        test "$(uname -m)" = "x86_64"

        echo
        echo "===== WORKSPACE ====="

        pwd

        test -d .git
        test -f package.json
        test -f bun.lock
        test -f security/opengrep/rules.yml
        test -f security/opengrep/fixtures/positive.ts

        echo
        echo "===== DEPENDENCIAS ====="

        apt-get update

        apt-get install \
          -y \
          --no-install-recommends \
          ca-certificates \
          curl

        rm -rf /var/lib/apt/lists/*

        echo
        echo "===== OPENGREP 1.27.1 ====="

        curl \
          -fsSL \
          --retry 3 \
          --output /tmp/opengrep \
          https://github.com/opengrep/opengrep/releases/download/v1.27.1/opengrep_manylinux_x86

        chmod 0755 /tmp/opengrep

        /tmp/opengrep --version

        echo
        echo "===== SELFTEST DAS REGRAS ====="

        /tmp/opengrep scan \
          --metrics=off \
          --json-output=/tmp/opengrep-selftest.json \
          -f security/opengrep/rules.yml \
          security/opengrep/fixtures/positive.ts

        for RULE_ID in \
          security.javascript-typescript-eval \
          security.javascript-typescript-function-constructor \
          security.javascript-typescript-exec-call \
          security.javascript-typescript-weak-hash \
          security.javascript-typescript-disable-tls-verification
        do
          if grep -q "$RULE_ID" /tmp/opengrep-selftest.json; then
            echo "SELFTEST=${RULE_ID}=PASS"
          else
            echo "SELFTEST=${RULE_ID}=FAIL"
            exit 1
          fi
        done

        echo
        echo "OPENGREP_RULE_SELFTEST=PASS"

        echo
        echo "===== SCAN REAL: SRC ====="

        mkdir -p .security-results

        /tmp/opengrep scan \
          --metrics=off \
          --sarif-output=.security-results/opengrep.sarif \
          -f security/opengrep/rules.yml \
          src

        echo
        echo "===== JSON ====="

        /tmp/opengrep scan \
          --metrics=off \
          --json-output=.security-results/opengrep.json \
          -f security/opengrep/rules.yml \
          src

        echo
        echo "===== RELATORIOS ====="

        test -s .security-results/opengrep.sarif
        test -s .security-results/opengrep.json

        wc -c \
          .security-results/opengrep.sarif \
          .security-results/opengrep.json

        echo
        echo "OPENGREP_REAL_SCAN=PASS"
