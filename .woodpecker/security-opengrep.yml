when:
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  - name: opengrep-sast
    image: debian:12-slim

    commands:
      - |
        set -eu

        export DEBIAN_FRONTEND=noninteractive

        echo "===== OPENGREP SAST POC ====="

        echo
        echo "===== ARQUITETURA ====="

        uname -a
        uname -m

        test "$(uname -m)" = "x86_64"

        echo
        echo "===== WORKSPACE ====="

        pwd

        test -d .git
        test -f package.json
        test -f bun.lock
        test -f security/opengrep/rules.yml
        test -f security/opengrep/fixtures/positive.ts

        echo
        echo "===== DEPENDENCIAS ====="

        apt-get update

        apt-get install \
          -y \
          --no-install-recommends \
          ca-certificates \
          curl

        rm -rf /var/lib/apt/lists/*

        echo
                echo
        echo "===== OPENGREP 1.27.1 - DOWNLOAD ====="

        rm -f /tmp/opengrep \
              /tmp/opengrep-version.out \
              /tmp/opengrep-version.err

        curl \
          -fL \
          --retry 3 \
          --retry-all-errors \
          --connect-timeout 10 \
          --max-time 120 \
          --output /tmp/opengrep \
          --write-out 'HTTP=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE_DOWNLOAD=%{size_download}\n' \
          https://github.com/opengrep/opengrep/releases/download/v1.27.1/opengrep_manylinux_x86

        echo
        echo "===== ARQUIVO BAIXADO ====="

        ls -lh /tmp/opengrep
        wc -c /tmp/opengrep

        MAGIC="$(
          od \
            -An \
            -tx1 \
            -N4 \
            /tmp/opengrep \
          | tr -d ' \n'
        )"

        echo "ELF_MAGIC=$MAGIC"

        if [ "$MAGIC" != "7f454c46" ]; then
          echo "OPENGREP_BINARY=INVALID"
          echo "Esperado ELF_MAGIC=7f454c46"
          exit 1
        fi

        echo "OPENGREP_BINARY=ELF_OK"

        chmod 0755 /tmp/opengrep

        echo
        echo "===== DEPENDENCIAS ELF ====="

        ldd /tmp/opengrep || true

        echo
        echo "===== TESTE --version ====="

        set +e

        /tmp/opengrep \
          --version \
          > /tmp/opengrep-version.out \
          2> /tmp/opengrep-version.err

        VERSION_RC=$?

        set -e

        echo "VERSION_EXIT_CODE=$VERSION_RC"

        echo
        echo "===== STDOUT ====="
        cat /tmp/opengrep-version.out || true

        echo
        echo "===== STDERR ====="
        cat /tmp/opengrep-version.err || true

        if [ "$VERSION_RC" -ne 0 ]; then
          echo "OPENGREP_VERSION_TEST=FAIL"
          exit "$VERSION_RC"
        fi

        echo "OPENGREP_VERSION_TEST=PASS"
